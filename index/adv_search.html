<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>advanced_search</title>
    <link rel="stylesheet" href="../styleing/style_adv.css">
</head>
<body>
    <header id="Google"  style="border: 100%;border-bottom:2px solid rgb(20, 20, 20) ;">Google</header>
    <!-- <hr style="border: ; width:100vh;"> -->
    <main>
    <div id="form">
        <form action="https://www.google.com/search">
            <h1>Advanced Search</h1>
 
            <h3>Find pages with</h3>

            <div class="lable_place">
            <label for="all" class="Text">All these words:</label>
            <input id="all" type="text" name="as_q" placeholder="type...." class="placeholder">
            </div>

            <div class="lable_place">
            <label for="exact" class="Text">This exact word or phrase:</label>
            <input id="exact" type="text" name="as_epq" placeholder="type...." class="placeholder">
            </div>

            <div class="lable_place">
            <label for="none" class="Text">None of these words:</label>
            <input id="none" type="text" name="as_eq" placeholder="type...." class="placeholder">
            </div>

            <div class="lable_place">
            <label for="site" class="Text">Site or domain:</label>
            <input id="site" type="text" name="as_sitesearch" placeholder="type...." class="placeholder">
            </div>

            <div id="submit_div">
                <input type="submit" id="submit" value="Advanced search">
            </div>
     </form>
     
    </div>
        
    </div>
    </main>
